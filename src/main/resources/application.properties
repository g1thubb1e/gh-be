spring.application.name=be
spring.mvc.servlet.path=/api

# Actuator / Prometheus metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# ?? Neo4j (5.11+, Spring Boot 3.5.13 BOM ?? SDN) ????????????????????????????
spring.neo4j.uri=${NEO4J_URL}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.data.neo4j.database=neo4j

# ?? PostgreSQL + pgvector ??????????????????????????????????????????????????????
spring.datasource.url=${PGVECTOR_URL}
spring.datasource.username=${PGVECTOR_USER}
spring.datasource.password=${PGVECTOR_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# AI provider: OpenRouter primary/fallback/embedding
ai.primary.provider=${AI_PRIMARY_PROVIDER:openrouter}
ai.primary.base-url=${AI_PRIMARY_BASE_URL:https://openrouter.ai/api/v1}
ai.primary.api-key=${AI_PRIMARY_API_KEY:${OPENROUTER_API_KEY:}}
ai.primary.model-name=${AI_PRIMARY_MODEL_NAME:deepseek/deepseek-v4-flash}
ai.primary.temperature=${AI_PRIMARY_TEMPERATURE:0.2}
ai.primary.max-tokens=${AI_PRIMARY_MAX_TOKENS:4096}
ai.primary.timeout-seconds=${AI_PRIMARY_TIMEOUT_SECONDS:300}

ai.fallback.enabled=${AI_FALLBACK_ENABLED:true}
ai.fallback.provider=${AI_FALLBACK_PROVIDER:openrouter}
ai.fallback.base-url=${AI_FALLBACK_BASE_URL:https://openrouter.ai/api/v1}
ai.fallback.api-key=${AI_FALLBACK_API_KEY:${AI_PRIMARY_API_KEY:${OPENROUTER_API_KEY:}}}
ai.fallback.model-name=${AI_FALLBACK_MODEL_NAME:}
ai.fallback.temperature=${AI_FALLBACK_TEMPERATURE:0.2}
ai.fallback.max-tokens=${AI_FALLBACK_MAX_TOKENS:2048}
ai.fallback.timeout-seconds=${AI_FALLBACK_TIMEOUT_SECONDS:120}

ai.embedding.provider=${AI_EMBEDDING_PROVIDER:openrouter}
ai.embedding.base-url=${AI_EMBEDDING_BASE_URL:https://openrouter.ai/api/v1}
ai.embedding.api-key=${AI_EMBEDDING_API_KEY:${OPENROUTER_API_KEY:}}
ai.embedding.model-name=${AI_EMBEDDING_MODEL_NAME:openai/text-embedding-3-large}
ai.embedding.dimension=${AI_EMBEDDING_DIMENSION:3072}
ai.embedding.timeout-seconds=${AI_EMBEDDING_TIMEOUT_SECONDS:60}

# ?? GraphRAG ?????? ?? ?????????????????????????????????????????????????
graphrag.embedding.dimension=${AI_EMBEDDING_DIMENSION:3072}
graphrag.embedding.model=${AI_EMBEDDING_MODEL_NAME:openai/text-embedding-3-large}
graphrag.embedding.similarity=cosine

# topK=5: ??? ??????? ?? 5?? ??? ???.
graphrag.retriever.hybridTopK=5
graphrag.retriever.fulltextWeight=0.6
graphrag.retriever.graphWeight=0.6
graphrag.retriever.vectorWeight=0.4


# ?? intent(GROUP_*, NODE_*, EDGE_*): ????+??+?? ?? ??.
graphrag.context.maxTokens=6000
# ?? intent(STRUCTURE_*, HUB_NODES, FLOW_TRACE): ?? ??? ??.
graphrag.context.maxTokensLarge=20000

graphrag.ingestion.lock-policy=block
graphrag.ingestion.tx-timeout=180s

graphrag.query.timeout=90s

graphrag.resilience.llm.maxRetries=2
graphrag.resilience.llm.retryBackoff=500ms
graphrag.resilience.embedding.maxRetries=3
graphrag.resilience.embedding.retryBackoff=1s

# LangChain4j HTTP ??/?? ?? (LM Studio ?? ???)
logging.level.dev.langchain4j=INFO
logging.level.dev.langchain4j.http.client.log=INFO

# SSE ?? HTTP ??
logging.level.d.l.http.client.log=INFO

# GitHub OAuth
github.oauth.client-id=${GH_CLIENT_ID}
github.oauth.client-secret=${GH_CLIENT_SECRET}
github.oauth.redirect-uri=${GH_REDIRECT_URI}
github.oauth.authorize-url=https://github.com/login/oauth/authorize
github.oauth.scope=read:user user:email

# GitHub Repository API
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.api-version=${GITHUB_API_VERSION:2026-03-10}

# External AI setup API
ai-server.api.base-url=${AI_SERVER_BASE_URL}
ai-server.api.setup-path=${AI_SERVER_GENERATE_PATH}

# AWS S3
aws.s3.bucket=${S3_ARTIFACT_BUCKET}
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.artifact-prefix=gh

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-millis=3600000
jwt.refresh-token-expiration-millis=1209600000
jwt.cookie-secure=true
jwt.cookie-same-site=None
# jwt.cookie-same-site=Lax

# Global
global.fe-base-url=${FE_BASEURL}
global.fe-login-success-uri=${FE_LANDING_PAGE}
